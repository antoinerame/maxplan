services:
  tgvmax:
    build: .
    image: tgvmax-dashboard:latest
    container_name: tgvmax
    ports:
      # http://localhost:8765, joignable depuis la machine seulement : le reverse proxy (nginx, Caddy…)
      # s'y connecte. BIND=0.0.0.0 dans .env si le proxy est ailleurs (le port ne doit pas être public).
      - "${BIND:-127.0.0.1}:${HOST_PORT:-8765}:8765"
    environment:
      MAXFINDER_HOST: "0.0.0.0"
      PORT: "8765"
      DATA_DIR: "/data"
    env_file:
      - .env            # fournit SNCF_TOKEN (clé API Navitia)
    volumes:
      - geocache:/data  # cache de géocodage, historique des places Max, retours des visiteurs
    restart: unless-stopped
    # garde-fous : le site ne peut pas prendre plus d'un cœur ni plus de 1 Go au reste du serveur
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s


  # Tunnel Cloudflare (facultatif) : publie le site sur maxplan.fr sans ouvrir aucun port sur la box.
  # Démarrer avec : docker compose --profile cloudflare up -d   (jeton dans .env : CLOUDFLARE_TUNNEL_TOKEN)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: maxplan-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - tgvmax
    restart: unless-stopped
    profiles: ["cloudflare"]

volumes:
  geocache: